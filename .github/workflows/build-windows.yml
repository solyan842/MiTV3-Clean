name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/MiTV3Clean/MiTV3Clean.csproj

      - name: Build
        run: dotnet build src/MiTV3Clean/MiTV3Clean.csproj -c Release --no-restore

      - name: Publish portable
        run: >
          dotnet publish src/MiTV3Clean/MiTV3Clean.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/MiTV3-Clean-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: MiTV3-Clean-win-x64
          path: dist/MiTV3-Clean-win-x64/**
